name: 小红书去广告
description: 过滤信息流推广，移除图片及视频水印；合并重复响应处理并减少脚本匹配与持久化写入。
author: RuCu6[https://github.com/RuCu6], fmz200[https://github.com/fmz200]; optimized by AWelook
homepage: https://github.com/AWelook/Egern-Modules-Optimized
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/RedPaper.png
open_url: https://apps.apple.com/app/id741292507
rules:
  - and:
      match:
        - protocol:
            match: quic
        - domain_suffix:
            match: xiaohongshu.com
      policy: REJECT
body_rewrites:
  - response_jq:
      match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/search\/banner_list$
      filter: if (getpath([]) | has("data")) then (setpath(["data"]; {})) else . end
  - response_jq:
      match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/search\/hot_list$
      filter: if (getpath(["data"]) | has("items")) then (setpath(["data","items"]; [])) else . end
  - response_jq:
      match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v4\/search\/hint
      filter: if (getpath(["data"]) | has("hint_words")) then (setpath(["data","hint_words"]; [])) else . end
  - response_jq:
      match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v4\/search\/trending\?
      filter: if (getpath(["data"]) | has("queries")) then (setpath(["data","queries"]; [])) else . end | if (getpath(["data"]) | has("hint_word")) then (setpath(["data","hint_word"]; {})) else . end
url_rewrites:
  - match: ^https:\/\/ci\.xiaohongshu\.com\/system_config\/watermark
    location: http://reject-img/
map_locals:
  - match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/v1\/surprisebox\/(?:get_style|open|submit_action)
    status_code: 200
    body: "{}"
    headers:
      Content-Type: application/json
  - match: ^https:\/\/www\.xiaohongshu\.com\/api\/marketing\/box\/trigger\?
    status_code: 200
    body: "{}"
    headers:
      Content-Type: application/json
  - match: ^https:\/\/edith\.xiaohongshu\.com\/api\/sns\/(?:v2\/guide\/user_banner|v3\/note\/guide)
    status_code: 200
    body: "{}"
    headers:
      Content-Type: application/json
  - match: ^https:\/\/www\.xiaohongshu\.com\/api\/sns\/(?:v1\/ads\/resource|v2\/hey\/\w+\/hey_gallery)
    status_code: 200
    body: "{}"
    headers:
      Content-Type: application/json
scriptings:
  - http_response:
      name: xiaohongshu_response
      match: ^https:\/\/(?:edith\.xiaohongshu\.com\/api\/sns\/(?:v1\/note\/(?:imagefeed|live_photo\/save)|v1\/system\/service\/ui\/config\?|v1\/system_service\/config\?|v2\/system_service\/splash_config|v2\/(?:note\/widgets|user\/followings\/followfeed)|v4\/followfeed\?|v5\/recommend\/user\/follow_recommend\?|(?:v1\/interaction\/comment\/video\/download|v5\/note\/comment\/list)|(?:v2\/note\/feed|v3\/note\/videofeed))|(?:edith|rec)\.xiaohongshu\.com\/api\/sns\/v6\/homefeed\?|(?:edith|so)\.xiaohongshu\.com\/api\/sns\/v10\/search\/notes\?|(?:edith|rec|www)\.xiaohongshu\.com\/api\/sns\/(?:v4\/note\/videofeed|v10\/note\/video\/save))
      script_url: https://raw.githubusercontent.com/AWelook/Egern-Modules-Optimized/main/scripts/ad/xiaohongshu-ads/RedPaper_remove_ads.js
      body_required: true
mitm:
  hostnames:
    includes:
      - ci.xiaohongshu.com
      - edith.xiaohongshu.com
      - rec.xiaohongshu.com
      - so.xiaohongshu.com
      - www.xiaohongshu.com
