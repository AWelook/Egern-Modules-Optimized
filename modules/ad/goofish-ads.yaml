name: 闲鱼去广告
description: 移除闲鱼开屏、首页、搜索、我的页面及推荐广告；稳定性与重复匹配优化版
author: "@ddgksf2013; optimized by AWelook"
homepage: https://github.com/AWelook/Egern-Modules-Optimized
rules:
  - domain_suffix:
      match: iyes.youku.com
      policy: REJECT
body_rewrites:
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.user\.strategy\.list(?:\/|\?|$)
      filter: .data.strategies = [{}]
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlehome\.home\.circle\.list(?:\/|\?|$)
      filter: if (.data.circleList? | type) == "array" then .data.circleList |= map(select(.bizCode? != "saveMoney")) else . end
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlehome\.home\.nextfresh(?:\/|\?|$)
      filter: if (.data.homeTopList? | type) == "array" then .data.homeTopList |= .[0:1] else . end | if (.data.sections? | type) == "array" then .data.sections |= map(select(.data.bizType? == "item")) else . end
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlemtopsearch\.search\.shade(?:\/|\?|$)
      filter: .data.singleShadeWords = [{}]
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlemtopsearch\.item\.search\.activate(?:\/|\?|$)
      filter: .data.cardList = [{}]
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlemtopsearch\.search\.discover(?:\/|\?|$)
      filter: del(.data.resultList)
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.idle\.user\.page\.my\.adapter(?:\/|\?|$)
      filter: .data.ability = [] | if (.data.container.sections? | type) == "array" then .data.container.sections |= map(select((.sectionBizCode? | type) == "string" and (.sectionBizCode | test("head|user|trade")))) else . end
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.item\.buy\.feeds(?:\/|\?|$)
      filter: del(.data.sections)
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.local\.home(?:\/|\?|$)
      filter: if (.data.sections? | type) == "array" then .data.sections |= map(select(.data.bizType? == "item")) else . end
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idlemtopsearch\.search(?:\/|\?|$)
      filter: if (.data.resultList? | type) == "array" then .data.resultList |= map(select(.data.item.main.clickParam.args.biz_type? == "item")) else . end
  - response_jq:
      match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.taobao\.idle\.item\.recommend(?:\/|\?|$)
      filter: if (.data.cardList? | type) == "array" then .data.cardList |= map(select(.cardData.bizType? != "mamaAD")) else . end
map_locals:
  - match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop.*splash\.ads
    status_code: 200
    body: ""
  - match: ^https?:\/\/(g-)?acs\.m\.goofish\.com\/gw\/mtop\.idle\.ad\.expose(?:\/|\?|$)
    status_code: 200
    body: ""
scriptings:
  - http_response:
      name: amdc
      match: ^http:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,4}(:\d+)?\/amdc\/mobileDispatch
      script_url: https://raw.githubusercontent.com/AWelook/Egern-Modules-Optimized/main/scripts/ad/goofish-ads/amdc.js
      timeout: 5
      body_required: false
mitm:
  hostnames:
    includes:
      - acs.m.goofish.com
      - g-acs.m.goofish.com
