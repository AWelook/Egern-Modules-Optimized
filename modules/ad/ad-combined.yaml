scriptings:
  - http_request:
      name: "12306"
      match: ^https?:\/\/ad\.12306\.cn\/ad\/ser\/getAdList
      script_url: https://raw.githubusercontent.com/AWelook/Egern-Modules-Optimized/main/scripts/ad/12306/12306.js
      max_size: -1
      timeout: 60
      body_required: true
  - http_response:
      name: amap
      match: ^https?:\/\/.*\.amap\.com\/(?:ws\/message\/notice\/list|ws\/shield\/frogserver\/aocs\/updatable|ws\/shield\/search\/nearbyrec_smart|ws\/promotion-web\/resource|ws\/faas\/amap-navigation\/main-page|ws\/valueadded\/alimama\/splash_screen|ws\/msgbox\/pull|ws\/shield\/dsp\/profile\/index\/nodefaas|ws\/shield\/search\/new_hotword)
      script_url: https://raw.githubusercontent.com/AWelook/Egern-Modules-Optimized/main/scripts/ad/amap-ads/amap.js
      max_size: -1
      timeout: 60
      body_required: true
  - http_response:
      name: 移除扫码取件页面商品推荐及弹窗
      match: ^https:\/\/m\.pinduoduo\.net\/mdkd\/package\?from_app_scan
      script_url: https://raw.githubusercontent.com/AWelook/Egern-Modules-Optimized/main/scripts/ad/pinduoduo-ads/PinDuoDuo_remove_ads.js
      body_required: true
  - http_request:
      name: reddit_translation
      match: ^https:\/\/gql(?:-fed)?\.reddit\.com\/
      script_url: https://raw.githubusercontent.com/AWelook/Egern-Modules-Optimized/main/scripts/ad/reddit-ads/translation.js
      env:
        TRANSLATION: "{{{TRANSLATION}}}"
        TRANSLATION_VALUE: "{{{TRANSLATION_VALUE}}}"
  - http_response:
      name: xiaohongshu_response
      match: ^https:\/\/(?:edith\.xiaohongshu\.com\/api\/sns\/(?:v1\/note\/(?:imagefeed|live_photo\/save)|v1\/system\/service\/ui\/config\?|v1\/system_service\/config\?|v2\/system_service\/splash_config|v2\/(?:note\/widgets|user\/followings\/followfeed)|v4\/followfeed\?|v5\/recommend\/user\/follow_recommend\?|(?:v1\/interaction\/comment\/video\/download|v5\/note\/comment\/list)|(?:v2\/note\/feed|v3\/note\/videofeed))|(?:edith|rec)\.xiaohongshu\.com\/api\/sns\/v6\/homefeed\?|(?:edith|so)\.xiaohongshu\.com\/api\/sns\/v10\/search\/notes\?|(?:edith|rec|www)\.xiaohongshu\.com\/api\/sns\/(?:v4\/note\/videofeed|v10\/note\/video\/save))
      script_url: https://raw.githubusercontent.com/AWelook/Egern-Modules-Optimized/main/scripts/ad/xiaohongshu-ads/RedPaper_remove_ads.js
      body_required: true
  - http_response:
      name: combined_amdc
      match: ^http:\/\/(?:amdc\.m\.taobao\.com|[a-zA-Z0-9_-]+(?:\.[a-zA-Z0-9_-]+){1,4}(?::\d+)?\/amdc\/mobileDispatch)
      script_url: https://raw.githubusercontent.com/AWelook/Egern-Modules-Optimized/main/scripts/ad/goofish-ads/amdc.js
      body_required: false
      timeout: 60
