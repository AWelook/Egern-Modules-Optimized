name: 微博轻享版去广告
description: 过滤轻享版广告，移除各部分推广模块；合并用户中心卡片遍历，仅支持到6.6.8版。
author: kokoryh[https://github.com/kokoryh]; optimized by AWelook
homepage: https://github.com/AWelook/Egern-Modules-Optimized
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Weibo_intl.png
open_url: https://apps.apple.com/app/id1215210046
body_rewrites:
  - response_jq:
      match: ^https?:\/\/api\.weibo\.cn\/2\/statuses\/unread_hot_timeline$
      filter: del(.ad, .advertises, .trends) | if .statuses then .statuses |= map(select(((.promotion.type == "ad") or (.mblogtypename | IN("广告", "廣告", "热推", "熱推"))) | not)) end
  - response_jq:
      match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=get_coopen_ads&
      filter: .data |= . + {"ad_list":[],"pic_ad":[],"gdt_video_ad_ios":[],"display_ad":0,"ad_ios_id":null,"app_ad_ios_id":null,"reserve_ad_ios_id":"","reserve_app_ad_ios_id":"","ad_duration":604800,"ad_cd_interval":604800}
  - response_jq:
      match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=trends&
      filter: if .data.order then .data.order=["search_topic"] end
  - response_jq:
      match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=search_topic&
      filter: if .data.search_topic.cards[0].type == "searchtop" then del(.data.search_topic.cards[0]) end
  - response_jq:
      match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=user_center&
      filter: if .data.cards then .data.cards |= map((.items |= map(select(.type != "personal_vip"))) | select((.items | length) > 0)) end
map_locals:
  - match: ^https?:\/\/api\.weibo\.cn\/2\/ad\/weibointl\?
    status_code: 200
    body: "{}"
  - match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=get_searching_info&
    status_code: 200
    body: '{"retcode":0,"info":"","data":{"expiration_time":"86400","cards":[{"tip":"搜索微博","word":""}]}}'
    headers:
      Content-Type: text/html
  - match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?ct=feed&a=search_topic&
    status_code: 200
    body: '{"retcode":0,"info":"","data":[],"ext":{}}'
    headers:
      Content-Type: text/html
mitm:
  hostnames:
    includes:
      - api.weibo.cn
      - weibointl.api.weibo.cn
