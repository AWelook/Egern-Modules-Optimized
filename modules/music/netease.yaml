name: 网易云音乐净化（Egern 低开销版）
description: 去广告、评论净化、Tab 与首页定制；Egern 原生二进制/AES 处理
icon: https://raw.githubusercontent.com/Keywos/rule/main/tv/app/144px/Netease.png
compat_arguments:
  隐藏底部标签开关↓: --
  发现: "0"
  漫游: "1"
  笔记: "0"
  关注: "1"
  搜索: "1"
  首页自定义名称: "0"
  我的自定义名称: "0"
  漫游自定义名称: "0"
  笔记自定义名称: "0"
  发现自定义名称: "0"
  隐藏顶部标签开关↓: --
  心动: "1"
  播客: "1"
  听书: "1"
  活动Tab: "0"
  隐藏首页卡片开关↓: --
  问候语: "0"
  每日推荐: "0"
  推荐歌单: "0"
  最近常听: "0"
  音乐合伙人: "0"
  雷达歌单: "1"
  排行榜: "0"
  推荐专属歌单: "0"
  你的专属歌单: "1"
  私房推荐歌曲: "1"
  红心相似歌曲: "1"
compat_arguments_desc: |-
  底部Tab: 1=隐藏, 0=显示
  自定义名称: 留空则保持原名，填写则替换显示
  顶部Tab: 0=隐藏, 1=显示 (心动/播客/听书 默认显示, 活动Tab 默认隐藏)
  首页卡片: 1=显示, 0=隐藏
rules:
  - domain:
      match: iadmusicmat.music.126.net
      policy: REJECT-NO-DROP
  - domain:
      match: iadmat.nosdn.127.net
      policy: REJECT-NO-DROP
  - domain:
      match: iadmatapk.nosdn.127.net
      policy: REJECT-NO-DROP
  - domain:
      match: httpdns.n.netease.com
      policy: REJECT-NO-DROP
  - domain:
      match: httpdns.music.163.com
      policy: REJECT-NO-DROP
map_locals:
  - match: ^https?:\/\/(?:ipv4|interface\d?)\.music\.163\.com\/x?e?api\/ad
    status_code: 200
    body: "{}"
  - match: ^https?:\/\/interface\d?\.music\.163\.com\/w?e?api\/(?:side-bar\/mini-program\/music-service\/account|delivery\/(?:batch-deliver|deliver)|moment\/tab\/info\/get|yunbei\/account\/entrance\/get)
    status_code: 200
    body: "{}"
  - match: ^https?:\/\/interface\d?\.music\.163\.com\/x?eapi\/(?:resource\/comments?\/musiciansaid|community\/friends\/fans-group\/artist\/group\/get|user\/sub\/artist|music\/songshare\/text\/recommend\/get|mine\/applet\/redpoint|resniche\/position\/play\/new\/get)
    status_code: 200
    body: "{}"
  - match: ^https?:\/\/interface\d?\.music\.163\.com\/w?e?api\/search\/default
    status_code: 200
    body: "{}"
  - match: ^https?:\/\/interface\d?\.music\.163\.com\/w?e?api\/(?:search\/(?:chart|rcmd\/keyword|specialkeyword)|resource-exposure\/|activity\/bonus\/playpage\/time\/query)
    status_code: 200
    body: "{}"
  - match: ^https?:\/\/interface\d?\.music\.163\.com\/x?eapi\/(?:mlivestream\/entrance\/playpage|link\/(?:position\/show\/strategy|scene\/show)|ios\/version|v\d\/content\/exposure\/comment\/banner)
    status_code: 200
    body: "{}"
  - match: ^https?:\/\/interface\d?\.music\.163\.com\/store\/x?e?api\/(?:webconfig|entryconfig)
    status_code: 200
    body: "{}"
scriptings:
  - http_response:
      name: 网易云音乐_净化
      match: ^https?:\/\/(?:ipv4|interface\d?)\.music\.163\.com\/x?e?api\/(?:batch|v2\/resource\/comment\/floor\/get|v1\/user\/info|sp\/flow\/popup\/query|vipactivity\/app\/cashier\/setting\/get|homepage\/block\/page|user\/follow\/users\/mixed\/get\/v2|link\/(?:position\/show\/resource|home\/framework\/(?:top\/)?tab|page\/(?:discovery\/resource\/show|rcmd\/(?:resource\/show|block\/resource\/multi\/refresh))))(?:\?.*)?$
      script_url: https://raw.githubusercontent.com/AWelook/Egern-Modules-Optimized/main/scripts/music/netease/wyyad.js
      max_size: 0
      timeout: 20
      body_required: true
      binary_body: true
      env:
        FX: "{{{发现}}}"
        MY: "{{{漫游}}}"
        DT: "{{{笔记}}}"
        GZ: "{{{关注}}}"
        SOU: "{{{搜索}}}"
        SY_NAME: "{{{首页自定义名称}}}"
        WD_NAME: "{{{我的自定义名称}}}"
        MY_NAME: "{{{漫游自定义名称}}}"
        DT_NAME: "{{{笔记自定义名称}}}"
        FX_NAME: "{{{发现自定义名称}}}"
        XD: "{{{心动}}}"
        BK: "{{{播客}}}"
        TS: "{{{听书}}}"
        HDTAB: "{{{活动Tab}}}"
        PRGG: "{{{问候语}}}"
        PRDRD: "{{{每日推荐}}}"
        PRSCVPT: "{{{推荐歌单}}}"
        PRST: "{{{最近常听}}}"
        HMPR: "{{{音乐合伙人}}}"
        PRRR: "{{{雷达歌单}}}"
        PRRK: "{{{排行榜}}}"
        PRMST: "{{{推荐专属歌单}}}"
        PRCN: "{{{你的专属歌单}}}"
        PRPRS: "{{{私房推荐歌曲}}}"
        PRRSS: "{{{红心相似歌曲}}}"
mitm:
  hostnames:
    includes:
      - ipv4.music.163.com
      - interface.music.163.com
      - interface3.music.163.com
      - interface9.music.163.com
homepage: https://github.com/AWelook/Egern-Modules-Optimized
