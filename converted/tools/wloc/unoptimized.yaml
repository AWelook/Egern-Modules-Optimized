name: Apple WLOC 定位修改
description: "修改 Apple 网络定位返回坐标 | 快捷指令(推荐): 设置地理位置 https://www.icloud.com/shortcuts/a82717d8fdad4e6280866fcf911173f7 清理恢复位置 https://www.icloud.com/shortcuts/f42632d406504f24a2cd163af4fe012f | 选点页面: https://wloc-pages.pages.dev/"
author: Yu9191 Rewrite
homepage: https://github.com/Yu9191/wloc
compat_arguments:
  经度: "113.94114"
  纬度: "22.544577"
  精度: "25"
  日志级别: info
compat_arguments_desc: |-
  经度/纬度: 默认坐标(在线选点储存后优先)
  精度: GPS精度(米)
  日志级别: off/error/warn/info/debug/all

  使用方法: 打开选点页面 -> 选位置 -> 储存到设备
scriptings:
  - http_response:
      name: Apple WLOC
      match: ^https?:\/\/gs-loc(-cn)?\.apple\.com\/clls\/wloc
      script_url: https://raw.githubusercontent.com/Yu9191/wloc/refs/heads/main/dist/wloc.js
      max_size: 0
      timeout: 30
      body_required: true
      binary_body: true
      env:
        _compat.$argument: longitude={{{经度}}}&latitude={{{纬度}}}&accuracy={{{精度}}}&logLevel={{{日志级别}}}
  - http_request:
      name: WLOC Settings
      match: ^https?:\/\/gs-loc(-cn)?\.apple\.com\/wloc-settings\/save
      script_url: https://raw.githubusercontent.com/Yu9191/wloc/refs/heads/main/dist/wloc-settings.js
      max_size: 0
      timeout: 10
      body_required: false
mitm:
  hostnames:
    includes:
      - gs-loc.apple.com
      - gs-loc-cn.apple.com
